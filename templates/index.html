<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>InstaReels Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a10;
      --card: #131622;
      --card-border: #222738;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --gradient: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --accent: #e1306c;
      --success: #10b981;
      --error: #ef4444;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 4px 0 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(225, 48, 108, 0.12);
      border: 1px solid rgba(225, 48, 108, 0.25);
      color: #f472b6;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Main Card */
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Mode Tabs */
    .tab-bar {
      display: flex;
      background: #0d0f17;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #1e2436;
      color: #fff;
    }

    /* Input List */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #0d0f17;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      animation: fadeIn 0.2s ease;
    }

    .link-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .link-item-label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
    }

    .btn-remove-row {
      background: transparent;
      border: none;
      color: #ef4444;
      font-size: 12px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .btn-remove-row:hover {
      background: rgba(239, 68, 68, 0.15);
    }

    .link-input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: #141824;
      border: 1px solid #283144;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: all 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(225, 48, 108, 0.2);
    }

    .btn-paste-row {
      background: #202636;
      border: 1px solid #2d364d;
      color: #e2e8f0;
      padding: 0 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-paste-row:hover {
      background: #2b354d;
    }

    /* Add Row Button */
    .btn-add-row {
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed #333d54;
      color: #38bdf8;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-add-row:hover {
      background: rgba(56, 189, 248, 0.08);
      border-color: #38bdf8;
    }

    /* Bulk Textarea (Alternative tab) */
    .bulk-box textarea {
      width: 100%;
      min-height: 140px;
      background: #0d0f17;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      resize: vertical;
      line-height: 1.5;
      font-family: monospace;
    }

    .bulk-box textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(225, 48, 108, 0.2);
    }

    /* Main Action Button */
    .btn-download-all {
      width: 100%;
      background: var(--gradient);
      border: none;
      color: #fff;
      padding: 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(220, 39, 67, 0.4);
      transition: all 0.2s;
      margin-top: 4px;
    }

    .btn-download-all:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(220, 39, 67, 0.6);
    }

    .btn-download-all:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Progress & Queue Section */
    .progress-card {
      background: #0d0f17;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #1c2130;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--gradient);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .queue-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      background: #141824;
      border: 1px solid #22293b;
      border-radius: 10px;
      font-size: 12px;
    }

    .queue-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .queue-status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .status-waiting { background: #1e2436; color: #94a3b8; }
    .status-running { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .status-done { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .status-fail { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .video-preview-mini {
      width: 100%;
      max-height: 240px;
      border-radius: 8px;
      background: #000;
    }

    /* Quick Actions */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-action {
      background: #181d2c;
      border: 1px solid #283144;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: #232a3f;
    }

    .btn-zip {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-sm {
      background: #202638;
      border: 1px solid #313b52;
      color: #e5e7eb;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-sm:hover {
      background: #2b354d;
      color: #fff;
    }

    /* History */
    .history-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .history-title {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #0d0f17;
      border: 1px solid #1a1e2d;
      border-radius: 8px;
      font-size: 12px;
    }

    .history-name {
      color: #e2e8f0;
      max-width: 55%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="badge">⚡ Downloader Reels MP4</div>
      <h1 class="title">InstaReels Downloader</h1>
      <p class="subtitle">Baixe um ou vários vídeos do Instagram em MP4 com áudio e vídeo completos.</p>
    </header>

    <!-- Main Card -->
    <main class="card">
      <!-- Mode Tabs -->
      <div class="tab-bar">
        <button id="tabFields" class="tab-btn active">➕ Por Campos de Link</button>
        <button id="tabBulk" class="tab-btn">📋 Colar Lista (Texto)</button>
      </div>

      <!-- Mode 1: Dynamic Rows (Fields) -->
      <div id="fieldsContainer">
        <div id="linkRows" class="link-list">
          <!-- Row 1 (default) -->
          <div class="link-item" id="row-0">
            <div class="link-item-top">
              <span class="link-item-label">Link do Vídeo 1</span>
            </div>
            <div class="link-input-row">
              <input type="text" class="link-input" placeholder="https://www.instagram.com/reel/..." spellcheck="false">
              <button class="btn-paste-row" onclick="pasteToRow(0)">📋 Colar</button>
            </div>
          </div>
        </div>

        <button id="btnAddLink" class="btn-add-row" style="margin-top: 10px;">
          ➕ Adicionar mais um link
        </button>
      </div>

      <!-- Mode 2: Bulk Textarea -->
      <div id="bulkContainer" class="bulk-box hidden">
        <textarea 
          id="bulkTextarea" 
          placeholder="Cole vários links aqui (um por linha):&#10;https://www.instagram.com/reel/C8XYZ...&#10;https://www.instagram.com/reel/C9ABC..."
          spellcheck="false"
        ></textarea>
      </div>

      <!-- Action Button -->
      <button id="downloadBtn" class="btn-download-all">
        <span id="btnIcon">⬇</span>
        <span id="btnText">BAIXAR VÍDEOS</span>
        <div id="btnSpinner" class="spinner hidden"></div>
      </button>

      <!-- Progress / Queue Section -->
      <div id="progressCard" class="progress-card hidden">
        <div class="progress-header">
          <span id="progressSummary">Progresso: 0 de 0</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBarFill" class="progress-bar-fill"></div>
        </div>
        <div id="queueList" class="queue-list"></div>
      </div>

      <!-- Quick Actions -->
      <div class="actions-grid">
        <a id="btnZipAll" href="/api/download-zip" class="btn-action btn-zip">
          📦 Baixar Todos em .ZIP
        </a>
        <button id="btnClearServer" class="btn-action">
          🗑️ Limpar Pasta
        </button>
      </div>
    </main>

    <!-- History / Files on server -->
    <section class="history-card">
      <div class="history-header">
        <h2 class="history-title">Vídeos Salvos no Servidor</h2>
        <button id="refreshBtn" class="btn-sm">🔄 Atualizar</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>
  </div>

  <script>
    const tabFields = document.getElementById('tabFields');
    const tabBulk = document.getElementById('tabBulk');
    const fieldsContainer = document.getElementById('fieldsContainer');
    const bulkContainer = document.getElementById('bulkContainer');
    const linkRows = document.getElementById('linkRows');
    const btnAddLink = document.getElementById('btnAddLink');
    const bulkTextarea = document.getElementById('bulkTextarea');
    const downloadBtn = document.getElementById('downloadBtn');
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    const progressCard = document.getElementById('progressCard');
    const progressSummary = document.getElementById('progressSummary');
    const progressPercent = document.getElementById('progressPercent');
    const progressBarFill = document.getElementById('progressBarFill');
    const queueList = document.getElementById('queueList');

    const historyList = document.getElementById('historyList');
    const refreshBtn = document.getElementById('refreshBtn');
    const btnClearServer = document.getElementById('btnClearServer');

    let currentMode = 'fields'; // 'fields' or 'bulk'
    let rowCount = 1;
    let isProcessing = false;

    // Tabs switch
    tabFields.addEventListener('click', () => {
      currentMode = 'fields';
      tabFields.classList.add('active');
      tabBulk.classList.remove('active');
      fieldsContainer.classList.remove('hidden');
      bulkContainer.classList.add('hidden');
    });

    tabBulk.addEventListener('click', () => {
      currentMode = 'bulk';
      tabBulk.classList.add('active');
      tabFields.classList.remove('active');
      bulkContainer.classList.remove('hidden');
      fieldsContainer.classList.add('hidden');
    });

    // Add new row
    btnAddLink.addEventListener('click', () => {
      const idx = rowCount++;
      const item = document.createElement('div');
      item.className = 'link-item';
      item.id = `row-${idx}`;
      item.innerHTML = `
        <div class="link-item-top">
          <span class="link-item-label">Link do Vídeo ${idx + 1}</span>
          <button class="btn-remove-row" onclick="removeRow(${idx})">✕ Remover</button>
        </div>
        <div class="link-input-row">
          <input type="text" class="link-input" placeholder="https://www.instagram.com/reel/..." spellcheck="false">
          <button class="btn-paste-row" onclick="pasteToRow(${idx})">📋 Colar</button>
        </div>
      `;
      linkRows.appendChild(item);
      const input = item.querySelector('input');
      input.focus();
    });

    window.removeRow = function(idx) {
      const el = document.getElementById(`row-${idx}`);
      if (el) el.remove();
    };

    window.pasteToRow = async function(idx) {
      try {
        const text = await navigator.clipboard.readText();
        const row = document.getElementById(`row-${idx}`);
        if (row && text) {
          const input = row.querySelector('input');
          input.value = text.trim();
        }
      } catch (e) {
        const row = document.getElementById(`row-${idx}`);
        if (row) row.querySelector('input').focus();
      }
    };

    // Collect URLs from active mode
    function collectUrls() {
      let urls = [];
      if (currentMode === 'fields') {
        const inputs = linkRows.querySelectorAll('.link-input');
        inputs.forEach(input => {
          const val = input.value.trim();
          if (val && val.includes('instagram.com')) {
            urls.push(val);
          }
        });
      } else {
        const text = bulkTextarea.value;
        const regex = /https?:\/\/(?:www\.)?instagram\.com\/(?:reel|reels|p|tv)\/[A-Za-z0-9_-]+/g;
        urls = text.match(regex) || [];
      }
      return [...new Set(urls)];
    }

    // Download Handler
    downloadBtn.addEventListener('click', async () => {
      const urls = collectUrls();
      if (urls.length === 0) {
        alert('Por favor, cole pelo menos um link válido do Instagram.');
        return;
      }

      if (isProcessing) return;

      isProcessing = true;
      downloadBtn.disabled = true;
      btnIcon.classList.add('hidden');
      btnSpinner.classList.remove('hidden');
      btnText.textContent = `BAIXANDO (${urls.length} VÍDEOS)...`;

      progressCard.classList.remove('hidden');
      queueList.innerHTML = '';

      // Initialize queue
      const queueItems = urls.map((url, idx) => {
        const div = document.createElement('div');
        div.className = 'queue-item';
        div.id = `q-${idx}`;
        div.innerHTML = `
          <div class="queue-item-row">
            <span style="font-weight:700; color:#fff;">Vídeo ${idx + 1}</span>
            <span class="queue-status-badge status-waiting">Na fila</span>
          </div>
          <div style="font-size:11px; color:#94a3b8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
            ${url}
          </div>
          <div class="video-container" style="display:none; margin-top:6px;"></div>
        `;
        queueList.appendChild(div);
        return { url, idx, el: div };
      });

      let completed = 0;
      let successes = 0;

      for (const item of queueItems) {
        const badge = item.el.querySelector('.queue-status-badge');
        const container = item.el.querySelector('.video-container');

        badge.className = 'queue-status-badge status-running';
        badge.textContent = 'Baixando...';

        try {
          const res = await fetch('/api/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: item.url })
          });
          const data = await res.json();

          if (data && data.success) {
            badge.className = 'queue-status-badge status-done';
            badge.textContent = `✓ Concluído (${data.size_mb} MB)`;

            // Render video player with controls
            container.style.display = 'block';
            container.innerHTML = `
              <video class="video-preview-mini" controls playsinline>
                <source src="/videos/${encodeURIComponent(data.filename)}" type="video/mp4">
              </video>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
                <span style="font-size:11px; color:#34d399; font-weight:700;">MP4 Completo (Áudio + Vídeo)</span>
                <a href="/videos/${encodeURIComponent(data.filename)}" download="${data.filename}" class="btn-sm">💾 Baixar Arquivo</a>
              </div>
            `;
            successes++;
          } else {
            badge.className = 'queue-status-badge status-fail';
            badge.textContent = data.error || 'Erro no download';
          }
        } catch (err) {
          badge.className = 'queue-status-badge status-fail';
          badge.textContent = 'Falha de rede';
        }

        completed++;
        const pct = Math.round((completed / urls.length) * 100);
        progressSummary.textContent = `Progresso: ${completed} de ${urls.length} (${successes} com sucesso)`;
        progressPercent.textContent = `${pct}%`;
        progressBarFill.style.width = `${pct}%`;
      }

      isProcessing = false;
      downloadBtn.disabled = false;
      btnIcon.classList.remove('hidden');
      btnSpinner.classList.add('hidden');
      btnText.textContent = 'BAIXAR VÍDEOS';
      loadHistory();
    });

    // Clear server
    btnClearServer.addEventListener('click', async () => {
      if (confirm('Deseja apagar os vídeos da pasta do servidor para liberar espaço?')) {
        await fetch('/api/clear-videos', { method: 'POST' });
        loadHistory();
      }
    });

    // History
    async function loadHistory() {
      try {
        const res = await fetch('/api/videos');
        const videos = await res.json();
        if (!videos || videos.length === 0) {
          historyList.innerHTML = '<div style="color:#6b7280; font-size:11px; text-align:center; padding:10px;">Nenhum vídeo salvo no servidor.</div>';
          return;
        }

        historyList.innerHTML = '';
        videos.forEach(v => {
          const item = document.createElement('div');
          item.className = 'history-item';
          item.innerHTML = `
            <div class="history-name" title="${v.name}">${v.name}</div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:11px; color:#6b7280;">${v.size_mb} MB</span>
              <a href="/videos/${encodeURIComponent(v.name)}" download="${v.name}" class="btn-sm">⬇ Baixar</a>
            </div>
          `;
          historyList.appendChild(item);
        });
      } catch (e) {}
    }

    refreshBtn.addEventListener('click', loadHistory);
    loadHistory();
  </script>
</body>
</html>
